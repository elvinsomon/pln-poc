seed: 42
classes: [bug, feature, question]
paths:
  raw: data/raw/nlbse23-issue-classification-train.csv
  processed: data/processed
  splits: data/splits
  models: models
  reports: reports
  metrics: reports/metrics

# Configuración del acceso al dataset desde Colab.
# Convención de equipo: cada miembro añade "Añadir acceso directo a Mi unidad"
# sobre la carpeta compartida con nombre `MULCIA-PLN`. Así la ruta es la misma
# para todos y esta config puede vivir versionada en el repo.
drive:
  csv_path: /content/drive/MyDrive/MULCIA-PLN/data/nlbse23-issue-classification-train.csv
  copy_to_local: true                          # acelera I/O 10-20× (cache en /content/)
  local_cache_dir: /content/_dataset_cache
